name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test
      - run: npx --yes @vscode/vsce package --out /tmp/opencode-v2-sidebar-check.vsix

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Package VSIX
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx --yes @vscode/vsce package --out "opencode-v2-sidebar-${VERSION}.vsix"
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.vsix"
          generate_release_notes: true
